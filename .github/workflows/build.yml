name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk libltdl-dev libffi-dev libssl-dev
        pip install --upgrade pip
        pip install buildozer cython
    - name: Build with Buildozer
      run: |
        buildozer init
        sed -i 's/#requirements = python3/requirements = python3/g' buildozer.spec
        sed -i 's/#title = My Application/title = Deko Booster/g' buildozer.spec
        sed -i 's/#package.name = myapp/package.name = dekobooster/g' buildozer.spec
        sed -i 's/#package.domain = org.test/package.domain = org.deko/g' buildozer.spec
        buildozer -v android debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
